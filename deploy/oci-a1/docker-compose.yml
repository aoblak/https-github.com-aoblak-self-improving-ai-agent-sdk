services:
  agent-zero:
    image: agent0ai/agent-zero:latest
    container_name: agent-zero
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - agent_zero_usr:/a0/usr
    mem_limit: 4g
    cpus: 0.75
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1/', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - agents

  hermes:
    build:
      context: ./hermes
    container_name: hermes-agent
    restart: unless-stopped
    mem_limit: 5g
    cpus: 1.0
    environment:
      - HERMES_HOME=/home/hermes/.hermes
    volumes:
      - hermes_home:/home/hermes/.hermes
    healthcheck:
      test: ["CMD-SHELL", "test -d /home/hermes/.hermes"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - agents
    # Provider/API secrets are injected at deploy time; never commit them.

networks:
  agents:
    driver: bridge

volumes:
  agent_zero_usr:
  hermes_home:
